name: no secrets

# The pre-commit hook is the real guard; this is the backstop for anyone who
# cloned without running scripts/install-hooks.sh, or committed with --no-verify.
on: [push, pull_request]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-secrets.sh --all
