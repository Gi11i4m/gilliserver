# Devices on the LAN that gilliserver can wake. One per line:
#
#   <name> <mac-address> [ip-or-broadcast]
#
# Find a MAC with `arp -a` while the device is awake, and make sure Wake-on-LAN is
# enabled in its BIOS/UEFI *and* its OS network settings — most desktops disable it
# on shutdown by default.
#
# Wake one with: gilli-wake steam-machine

steam-machine 00:00:00:00:00:00
