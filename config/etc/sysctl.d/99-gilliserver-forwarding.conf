# IP forwarding, so gilliserver can act as a Tailscale exit node. Without this the
# node advertises itself, gets approved, and then silently blackholes every packet
# a client sends through it.
#
# DietPi's Tailscale install writes the same settings to dietpi-tailscale.conf, so
# on a box built the normal way this is redundant. It is here anyway because that
# file belongs to DietPi and exists only as a side effect of installing software
# ID 58 — this repo should not depend on a file it does not own for something the
# exit node cannot work without.

net.ipv4.ip_forward=1
net.ipv6.conf.all.forwarding=1
net.ipv6.conf.default.forwarding=1
